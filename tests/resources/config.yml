framework:
  secret: '12345'
  session:
    storage_factory_id: session.storage.factory.mock_file
  test: true
twig: ~
services:
  _defaults:
    autoconfigure: true
    autowire: true
    public: true
  League\CommonMark\CommonMarkConverter: ~
  logger:
    alias: Psr\Log\NullLogger
  Psr\Log\NullLogger: ~
  TJM\Wiki\Wiki:
    arguments:
      $opts:
        path: '%kernel.project_dir%/tests/tmp'
        eventDispatcher: '@event_dispatcher'
    calls:
      - addPlugin: ['@TJM\WikiSite\WikiSite']
  TJM\WikiSite\FormatConverter\MarkdownToHtmlConverter:
    arguments: ['@League\CommonMark\CommonMarkConverter']
  TJM\WikiSite\WikiSite:
    arguments:
      $opts:
        converters:
          - '@TJM\WikiSite\FormatConverter\MarkdownToHtmlConverter'
        router: '@router'
        twig: '@twig'
        #--force instantiate
        wiki: '@TJM\Wiki\Wiki'
    tags:
      - 'controller.service_arguments'
      -
        event: 'kernel.exception'
        method: 'handleException'
        name: 'kernel.event_listener'
